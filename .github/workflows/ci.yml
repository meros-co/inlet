#
# Builds Inlet and runs its tests on Windows, macOS and Linux, installs each
# package on the runner, and keeps the packages (unsigned) as the run's
# artifacts. The jobs are build.yml's, which releases run too.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
