#
# Builds Inlet on Windows, macOS and Linux, runs its tests, makes each
# platform's packages, installs and removes them on the runner, and keeps them
# as artifacts. CI (ci.yml) and releases (release.yml) both run it; a release
# also signs everything and notarizes the macOS package, and fails rather than
# ship anything unsigned.

name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Sign and notarize, and require it.
        type: boolean
        default: false
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      MACOS_APPLICATION_P12:
        required: false
      MACOS_INSTALLER_P12:
        required: false
      MACOS_P12_PASSWORD:
        required: false
      NOTARY_KEY_P8:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER:
        required: false

permissions:
  contents: read

env:
  GSTREAMER_VERSION: "1.26.11"

jobs:
  windows:
    name: Windows x64
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 90
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ inputs.release && vars.ARTIFACT_SIGNING_ENDPOINT || '' }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ inputs.release && vars.ARTIFACT_SIGNING_ACCOUNT || '' }}
      ARTIFACT_SIGNING_PROFILE: ${{ inputs.release && vars.ARTIFACT_SIGNING_PROFILE || '' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      INLET_REQUIRE_SIGNING: ${{ inputs.release && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GStreamer (MSVC x86_64 runtime and development files)
        shell: pwsh
        run: |
          $version = $env:GSTREAMER_VERSION
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          foreach ($name in "gstreamer-1.0-msvc-x86_64-$version.msi", "gstreamer-1.0-devel-msvc-x86_64-$version.msi") {
            $file = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "$base/$name" -OutFile $file
            $expected = (Invoke-WebRequest "$base/$name.sha256sum").Content.Split(" ")[0]
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expected) { throw "$name does not match its checksum" }
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$file`" /qn /norestart ADDLOCAL=ALL" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$name did not install ($($p.ExitCode))" }
          }
          $root = [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine").TrimEnd("\")
          if (-not (Test-Path "$root\include\gstreamer-1.0\gst\net\gstptpclock.h")) { throw "GStreamer's development files are not at $root" }
          "GSTREAMER_ROOT=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $file
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Pyrsys B\.V\.") { throw "Inno Setup's installer is not signed by its publisher" }
          $p = Start-Process $file -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup did not install ($($p.ExitCode))" }

      - name: Build and test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] }
          }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DGSTREAMER_ROOT=$env:GSTREAMER_ROOT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          # The JUCE the test build fetched, not a second download.
          packaging\windows\build-package.ps1 -GStreamerRoot $env:GSTREAMER_ROOT -JuceSource "$PWD\build\_deps\juce-src"

      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Inlet-*-windows-x64-setup.exe | Select-Object -First 1
          if ($env:INLET_REQUIRE_SIGNING -and (Get-AuthenticodeSignature $setup.FullName).Status -ne "Valid") { throw "The installer is not signed." }
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "The installer exited with $($p.ExitCode)." }
          $app = Join-Path $env:ProgramFiles "Inlet"
          if (-not (Test-Path "HKLM:\SOFTWARE\ASIO\Inlet")) { throw "The ASIO driver is not registered." }
          $svc = Get-Service inletd -ErrorAction Stop
          for ($i = 0; $i -lt 30 -and $svc.Status -ne "Running"; $i++) { Start-Sleep 1; $svc.Refresh() }
          if ($svc.Status -ne "Running") { Get-Content "$env:ProgramData\Inlet\inletd.log" -Tail 40 -ErrorAction SilentlyContinue; throw "The Inlet service is $($svc.Status)." }
          $status = $null
          for ($i = 0; $i -lt 30 -and -not $status; $i++) {
            try { $status = Invoke-RestMethod http://127.0.0.1:8091/inlet/v1/status -TimeoutSec 2 } catch { Start-Sleep 1 }
          }
          if (-not $status) { Get-Content "$env:ProgramData\Inlet\inletd.log" -Tail 40 -ErrorAction SilentlyContinue; throw "inletd does not answer." }
          $expected = python tools/set-version.py
          if ($status.version -ne $expected) { throw "inletd says version $($status.version), not $expected." }
          Write-Host "Installed: inletd $($status.version) running, ASIO driver registered."
          $p = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller exited with $($p.ExitCode)." }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $app "inletd.exe")); $i++) { Start-Sleep 1 }
          if (Get-Service inletd -ErrorAction SilentlyContinue) { throw "The service is still installed." }
          if (Test-Path "HKLM:\SOFTWARE\ASIO\Inlet") { throw "The ASIO driver is still registered." }
          if (Test-Path (Join-Path $app "inletd.exe")) { throw "Inlet's files are still installed." }
          Write-Host "Uninstalled cleanly."

      - uses: actions/upload-artifact@v7
        with:
          name: inlet-windows-x64
          path: dist/Inlet-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 120
    env:
      ARCHS: "arm64;x86_64"
      PKG_CONFIG_PATH: /Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the build tools
        run: brew install ninja pkgconf

      - name: Install GStreamer (the official universal framework)
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          for name in "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg"; do
            curl -fsSL -o "$RUNNER_TEMP/$name" "$base/$name"
            expected=$(curl -fsSL "$base/$name.sha256sum" | cut -d' ' -f1)
            echo "$expected  $RUNNER_TEMP/$name" | shasum -a 256 -c -
            sudo installer -pkg "$RUNNER_TEMP/$name" -target /
          done
          pkg-config --modversion gstreamer-net-1.0

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Import the signing certificates
        env:
          APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -z "$APPLICATION_P12" ]; then
            if [ "${{ inputs.release }}" = "true" ]; then echo "A release needs the Developer ID certificates (MACOS_APPLICATION_P12, ...)." >&2; exit 1; fi
            echo "No Developer ID certificates: the package is signed ad hoc and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in APPLICATION_P12 INSTALLER_P12; do
            printf '%s' "${!p12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          application=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          installer=$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          if [ -z "$application" ] || [ -z "$installer" ]; then echo "The certificates hold no Developer ID Application and Installer identities." >&2; exit 1; fi
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "CODESIGN_IDENTITY=$application"
            echo "INSTALLER_IDENTITY=$installer"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
            echo "SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package
        run: packaging/macos/build-package.sh

      - name: Install, check and uninstall
        run: |
          pkg=$(ls dist/Inlet-*-macos.pkg)
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            spctl --assess --type install --verbose "$pkg"
            xcrun stapler validate "$pkg"
          fi
          sudo installer -pkg "$pkg" -target /
          bin="/Library/Application Support/Inlet/bin"
          test "$("$bin/inletd" --version)" = "inletd $(python3 tools/set-version.py)"
          lipo -archs "$bin/inletd" | grep -q x86_64
          lipo -archs "$bin/inletd" | grep -q arm64
          test -d /Library/Audio/Plug-Ins/HAL/Inlet.driver
          for i in $(seq 30); do curl -fs http://127.0.0.1:8091/inlet/v1/status > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8091/inlet/v1/status > /dev/null || { tail -40 /Library/Logs/Inlet/inletd.log; exit 1; }
          echo "Installed: inletd running."
          sudo "/Library/Application Support/Inlet/uninstall.sh" --purge
          test ! -e "$bin/inletd"
          test ! -e /Library/Audio/Plug-Ins/HAL/Inlet.driver
          echo "Uninstalled cleanly."

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: inlet-macos
          path: dist/Inlet-*-macos.pkg
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12   # the .deb for Debian and Ubuntu
            package: DEB
          - distro: rocky9     # the .rpm for RHEL, Rocky, Alma and Fedora
            package: RPM
          - distro: arch       # the Arch package, from the PKGBUILD
            package: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the ${{ matrix.distro }} build image
        run: docker build -t inlet-build:${{ matrix.distro }} -f packaging/linux/docker/Dockerfile.${{ matrix.distro }} packaging/linux/docker

      - name: Build, test and package
        run: |
          mkdir -p dist
          # Docker's /dev/shm is 64 MB; the tests hold several of inletd's shared regions at once.
          docker run --rm --user root --shm-size=1g -e PACKAGE=${{ matrix.package }} -v "$PWD:/src" -w /src inlet-build:${{ matrix.distro }} bash -c '
            set -e
            git config --global --add safe.directory "*"
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build
            ctest --test-dir build --output-on-failure
            if [ -n "$PACKAGE" ]; then (cd build && cpack -G "$PACKAGE" && cp inlet*."${PACKAGE,,}" /src/dist/); fi
            chown -R "'"$(id -u):$(id -g)"'" build dist'

      - name: Package for Arch
        if: matrix.distro == 'arch'
        run: |
          docker run --rm --user root -v "$PWD:/src" inlet-build:arch bash -c '
            set -e
            mkdir -p /tmp/out && chown build /tmp/out
            su build -c "/src/packaging/linux/arch/makepkg-checkout.sh /src ${{ github.sha }} /tmp/out"
            cp /tmp/out/*.pkg.tar.zst /src/dist/
            chown -R "'"$(id -u):$(id -g)"'" /src/dist'

      - name: Install, check and remove
        run: |
          case "${{ matrix.distro }}" in
            debian12) install="apt-get update -qq && apt-get install -y ./dist/inlet_*_amd64.deb"; remove="apt-get remove -y inlet" ;;
            rocky9)   install="dnf install -y ./dist/inlet-*.x86_64.rpm";    remove="dnf remove -y inlet" ;;
            arch)     install="pacman -U --noconfirm ./dist/inlet-*.pkg.tar.zst"; remove="pacman -R --noconfirm inlet" ;;
          esac
          version=$(python3 tools/set-version.py)
          docker run --rm --user root -v "$PWD:/src" -w /src inlet-build:${{ matrix.distro }} bash -c "
            set -e
            $install
            test \"\$(inletd --version)\" = 'inletd $version'
            test -e /etc/alsa/conf.d/50-inlet.conf
            $remove
            ! command -v inletd"
          echo "Installed inletd $version, then removed it."

      - uses: actions/upload-artifact@v7
        with:
          name: inlet-linux-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error
