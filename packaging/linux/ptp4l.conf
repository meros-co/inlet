# The ptp4l Inlet runs when this computer has none of its own: a follower
# only, on Inlet's interface and domain, that measures the grandmaster's time
# and changes no clock (Inlet passes --slaveOnly 1 --free_running 1 and the
# interface, domain and socket itself). These are the AES67 media profile's
# defaults; a ptp4l of your own, when running, is followed instead.

[global]
delay_mechanism         E2E
network_transport       UDPv4
logAnnounceInterval     1
announceReceiptTimeout  3
logSyncInterval         -3
logMinDelayReqInterval  0
# Some network cards take a while to hand back transmit timestamps.
tx_timestamp_timeout    10
